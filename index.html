<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutorials</title>
<meta name="description" content="Notes and guides on data-intensive systems: DDIA, system design, and Bigtable.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f1ea;
    --ink: #1c1915;
    --muted: #5c564c;
    --line: #d9d1c3;
    --card: #fffdf8;
    --accent: #8c3a2f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161411;
      --ink: #f3efe6;
      --muted: #b7aea0;
      --line: #3a342c;
      --card: #211e1a;
      --accent: #e8a598;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 18px/1.5 Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    background: var(--bg);
    color: var(--ink);
  }
  main {
    max-width: 40rem;
    margin: 0 auto;
    padding: 4.5rem 1.25rem 5rem;
  }
  h1 {
    font-size: 2.4rem;
    font-weight: 500;
    letter-spacing: -0.03em;
    margin: 0 0 0.4rem;
  }
  .lede {
    margin: 0 0 2.2rem;
    color: var(--muted);
  }
  ol {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li + li { margin-top: 0.75rem; }
  a.card {
    display: block;
    padding: 1rem 1.1rem 1.05rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: inherit;
    text-decoration: none;
  }
  a.card:hover h2,
  a.card:focus-visible h2 { color: var(--accent); }
  a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h2 {
    font-size: 1.25rem;
    font-weight: 500;
    margin: 0 0 0.25rem;
  }
  p { margin: 0; color: var(--muted); }
  .status { margin-top: 1.5rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Tutorials</h1>
  <p class="lede">Notes and guides on data-intensive systems. Each one lives in its own repository.</p>
  <ol id="list"></ol>
  <p class="status" id="status" hidden></p>
</main>
<script>
(async function () {
  var list = document.getElementById("list");
  var status = document.getElementById("status");
  try {
    var response = await fetch("catalog.json");
    if (!response.ok) throw new Error("catalog.json returned " + response.status);
    var items = await response.json();
    items.forEach(function (item) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.className = "card";
      a.href = item.url;
      var h2 = document.createElement("h2");
      h2.textContent = item.title;
      var p = document.createElement("p");
      p.textContent = item.description;
      a.append(h2, p);
      li.append(a);
      list.append(li);
    });
  } catch (err) {
    status.hidden = false;
    status.textContent = "Could not load the catalog.";
  }
})();
</script>
</body>
</html>
